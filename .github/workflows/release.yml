name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this package version to npm after demo rollout and smoke checks
        type: boolean
        required: true
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: podaj-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'hasparus/podaj' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install frozen dependencies and OIDC-capable npm
        run: |
          bun install --frozen-lockfile
          npm install --global npm@11.5.1 --ignore-scripts
      - name: Preflight demo configuration and credentials
        run: bun scripts/release.ts preflight-demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - name: Preflight publication ref, version, authentication and registry
        if: env.PUBLISH == 'true'
        run: bun scripts/release.ts preflight-publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun run check
      - name: Full tests including build
        run: bun run test
      - name: Pack the tested build once without lifecycle scripts
        run: bun scripts/release.ts pack
      - name: Upload tested installable package before deployment
        uses: actions/upload-artifact@v4
        with:
          name: podaj-tested-${{ github.sha }}-${{ github.run_attempt }}
          path: .cloudflare/podaj-*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Deploy demo then set runtime secret with pinned Wrangler under Node
        run: bun scripts/release.ts deploy-demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - name: Live public config, documents, security, assets and admission smoke
        run: bun scripts/release.ts smoke-demo
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - name: Publish the existing archive once with provenance
        if: env.PUBLISH == 'true'
        run: bun scripts/release.ts publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Record verification boundary
        run: |
          printf '%s\n' 'Smoke checks do not verify live Turnstile or a human fill. No captcha bypass is enabled.' >> "$GITHUB_STEP_SUMMARY"
